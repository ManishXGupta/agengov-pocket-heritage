name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate passports
        run: python -m pocket_heritage.cli validate data/passports
      - name: Unit and end-to-end tests
        run: pytest -q
      - name: Synthetic evaluation (G1 to G6)
        run: python eval/run_eval.py --out /tmp/eval
      - name: Verify audit chain
        run: python -m pocket_heritage.cli verify-audit /tmp/eval/audit_log.jsonl
